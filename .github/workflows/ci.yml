name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (single source of truth)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the gate harness
        run: ./scripts/verify.sh

  # Decides whether `e2e` runs. A separate job because `actions/checkout` defaults
  # to depth 1 and a diff needs history — `fetch-depth: 0` is paid once here rather
  # than on the job that is about to skip.
  #
  # This is an ALLOWLIST of inert paths, and that direction is the whole point. A
  # path nobody anticipated runs the suite instead of skipping it, so a new
  # directory cannot silently lose coverage — only the four patterns named below
  # can skip, and adding to them is a deliberate edit.
  #
  # MARKDOWN IS NOT INERT IN THIS REPO. Two scenarios read it and execute it:
  #
  #   tests/e2e/ONT-093-quickstart-runs-as-documented.scenario.mjs:82
  #     lifts the root README's "## Quickstart" section and runs it verbatim
  #   tests/e2e/ONT-087-examples-run-as-documented.scenario.mjs:50
  #     lifts each examples/*/README.md "## Run it" section and runs it
  #
  # So `README.md` and `examples/**/README.md` are on the always-run side. The
  # obvious rule — "skip e2e when only docs changed" — would switch those two off
  # in the exact case they were built for, and the Quickstart would rot behind a
  # green suite. Only image and video files under examples/ are inert.
  #
  # `docs/**/*.md` is inert because no scenario reads it TODAY, verified by
  # grepping the suite for a repo-root join over `docs` (ONT-004's 'docs' is the
  # CLI subcommand name, not this directory). A future scenario that parses docs/
  # has to take it off this list or it loses its gate without anyone noticing.
  #
  # `LICENSE` is deliberately absent: ONT-019 asserts every package tarball
  # contains one.
  changed:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.classify.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # `git diff` against the PR base, not a third-party action. The diff is two
      # lines of shell and adds no supply-chain surface to a workflow that can see
      # the repository.
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          decide() {
            echo "verdict: run_e2e=$1 — $2"
            echo "run_e2e=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # main is the branch releases are cut from, and a merge commit's diff is
          # not the pull request's diff. e2e always runs there.
          [ "$EVENT" = "pull_request" ] || decide true "event is '$EVENT', not a pull request"

          FILES="$(git diff --name-only "$BASE...$HEAD" 2>/dev/null)" || FILES=""

          # An empty or uncomputable diff falls back to running. Skipping is the
          # only outcome that can lose coverage, so it is never the fallback.
          [ -n "$FILES" ] || decide true "no diff computed against '$BASE' — refusing to skip"

          echo "changed files:"
          echo "$FILES" | sed 's/^/  /'

          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              assets/*) ;;
              bench/*) ;;
              docs/*.md) ;;
              examples/*.gif|examples/*.png|examples/*.jpg|examples/*.jpeg|examples/*.webp|examples/*.svg|examples/*.mp4) ;;
              *) decide true "'$f' is not on the inert allowlist" ;;
            esac
          done <<< "$FILES"

          decide false "every changed file is on the inert allowlist"

  # A SEPARATE job, not a tenth gate inside verify.sh.
  #
  # verify.sh is what a contributor runs locally before every commit and it has
  # to stay in the ~60s range to keep being run at all. The e2e suite is a
  # different animal: it rebuilds the workspace, boots studio servers on real
  # ports, drives `orangerail mcp` over stdio, and runs `prisma db push` against
  # SQLite — minutes, not seconds. Folding it in would make the local gate one
  # nobody runs, and CI would gain nothing it does not already get from a job
  # running in parallel.
  #
  # As its own job it runs concurrently with `verify` (wall time is
  # max(verify, changed + e2e), not the sum), gets a clean runner with no
  # contention from five vitest pools, and fails the check independently — so a
  # red scenario is attributable at a glance instead of hiding behind a `verify`
  # failure. The `changed` hop in front of it costs a checkout; `verify` is ~72 s
  # and still sets the floor, so it is not on the critical path.
  #
  # Scenarios are NOT parallelized inside the job. Several bind ports, several
  # share `.docs/scratch/` run dirs, and ONT-018's `prisma db push` regenerates
  # the workspace-wide Prisma client that ONT-008 also observes. scripts/e2e.sh
  # already runs them serially and exits non-zero if any one fails, which is
  # exactly the contract this job needs — so there is one runner, not a matrix.
  e2e:
    needs: changed
    # Skipped via `if:`, which GitHub reports as a skipped job rather than a
    # failure. `main` carries no branch protection today, so no required check is
    # waiting on this; if protection is ever added with `e2e` required, confirm
    # the skip still satisfies it before trusting this line.
    if: needs.changed.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    # The full regression is minutes; this is a backstop against a scenario that
    # hangs on a port or an MCP handshake, not an expected duration.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Four scenarios (ONT-005/006/011/017) drive a REAL browser through the
      # agent-browser CLI, because the studio's value is what a human sees and a
      # jsdom assertion cannot speak to that. It is a global CLI rather than a
      # workspace dependency — direct Playwright is forbidden repo-wide — so CI
      # installs it explicitly. Pinned: an e2e gate that silently changes its
      # browser driver under us is not a gate. `--with-deps` pulls the Linux
      # shared libraries Chrome needs, which a bare runner does not have.
      - name: Install the browser driver for the studio scenarios
        run: |
          npm install --global agent-browser@0.27.0
          agent-browser install --with-deps
      - name: Run the e2e regression
        # No ticket argument = regression mode over every tests/e2e/*.sh.
        # A scenario needing live credentials declares `# @live-env: VAR`; the
        # flag makes such a scenario skip LOUDLY instead of failing a fork PR
        # that has no secrets (DEC-006). None declares one today — the flag is
        # set so that adding one later does not turn CI red for a contributor.
        run: ORANGERAIL_ALLOW_MISSING_LIVE=1 ./scripts/e2e.sh
